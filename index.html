<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>游戏</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#88231d">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="深宫浮生录">
    <link rel="icon" type="image/png" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <style>
        /* 全局基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #root_canvas {
            aspect-ratio: 16 / 9;
            /* 同时受宽度与高度约束：手机横屏（比 16:9 更宽）时按高度适配，避免上下裁切 */
            width: min(100vw, calc(100vh * 16 / 9), 1600px);
            position: relative;
            overflow: hidden;
            container-type: inline-size;
        }

        .view {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
        }

        img[class^="btn_"] {
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        img[class^="btn_"]:hover {
            transform: scale(1.03);
        }

        img[class^="btn_"]:active {
            transform: scale(0.97);
        }

        .cover_btn_box img {
            cursor: pointer;
            transition: 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .cover_btn img:hover {
            transform: scale(1.03);
        }

        .cover_btn img:active {
            transform: scale(0.97);
        }

        /* 红色通用按钮 */
        .game_btn {
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0.55);
            color: #fff;
            font-size: 1.6cqw;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .game_btn:hover {
            transform: scale(1.04);
        }

        .game_btn:active {
            transform: scale(0.96);
        }

        .game_btn.disabled {
            background: #444;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 存档弹窗 */
        #view_save_pop {
            z-index: 999;
        }

        .save_mask {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            position: absolute;
            z-index: 1;
        }

        .save_panel {
            position: absolute;
            width: 70%;
            height: 75%;
            left: 15%;
            top: 12.5%;
            background: #1a1010;
            border: 3px solid #88231d;
            border-radius: 16px;
            z-index: 2;
            padding: 4%;
            display: flex;
            flex-direction: column;
            gap: 4%;
        }

        .save_title {
            text-align: center;
            font-size: 3cqw;
            color: #fff;
            letter-spacing: 3px;
        }

        .save_slot_auto {
            width: 100%;
            height: 18%;
            background: #331818;
            border: 2px solid #662020;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #eee;
            transition: 0.2s;
        }

        .save_slot_auto:hover {
            border-color: #dd4444;
            background: #441c1c;
            transform: scale(1.01);
        }

        .save_slot_manual_wrap {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
            gap: 4%;
        }

        .save_slot {
            background: #331818;
            border: 2px solid #662020;
            border-radius: 10px;
            height: 100%;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #eee;
            transition: 0.2s;
        }

        .save_slot:hover {
            border-color: #dd4444;
            background: #441c1c;
            transform: scale(1.02);
        }

        .save_slot_empty {
            color: #888;
            font-size: 1.5cqw;
        }

        .save_slot_hasdata {
            font-size: 1.6cqw;
            line-height: 1.8;
            text-align: center;
        }

        .save_bottom_btn {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 4%;
        }

        .save_bottom_btn .game_btn {
            width: 9%;
            height: 100%;
        }

        /* 封面 */
        #view_cover #bg {
            width: 100%;
            height: 100%;
            background-image: url("fm.webp");
            background-size: cover;
            background-position: center;
        }

        .cover_btn_box {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10%;
        }

        .cover_btn_box img {
            width: 45%;
            height: auto;
            object-fit: cover;
            outline: none;
            border: none;
        }

        /* 主界面 */
        #bg_layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        .img_char {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            bottom: 0;
            width: auto;
            height: 90%;
            max-width: 45%;
            z-index: 2;
            pointer-events: none;
            object-fit: contain;
            object-position: bottom center;
        }

        /* 左侧人物框 透明无白底 */
        .left_white_box {
            position: absolute;
            left: 3.5%;
            top: 38%;
            transform: translateY(-50%);
            width: 21.6%;
            min-width: 15%;
            z-index: 3;
        }

        .left_white_box img {
            width: 100%;
            height: auto;
        }

        .img_top_time {
            position: absolute;
            left: 6%;
            top: 2%;
            width: 26%;
            z-index: 3;
        }

        .text_top_time {
            position: absolute;
            left: 6%;
            top: 2%;
            width: 26%;
            height: 8.4%;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.4cqw;
            color: #222;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .img_news_box {
            position: absolute;
            right: 8%;
            top: 16%;
            width: 23.4%;
            height: 31.2%;
            z-index: 3;
        }

        .text_news_title {
            position: absolute;
            right: 12%;
            top: 22%;
            width: 15.5%;
            height: 3.6%;
            z-index: 4;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.56cqw;
            color: #111;
            overflow: hidden;
            white-space: nowrap;
        }

        .text_news_content {
            position: absolute;
            right: 11.5%;
            top: 26.5%;
            width: 16%;
            max-height: 14%;
            z-index: 4;
            font-size: 1.7cqw;
            color: #222;
            line-height: 1.35;
            text-align: center;
            padding: 0 2%;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-all;
        }

        .btn_seasonplan {
            position: absolute;
            left: 6%;
            bottom: 25%;
            width: 15%;
            height: 8%;
            z-index: 5;
        }

        .btn_diary {
            position: absolute;
            left: 6%;
            bottom: 12%;
            width: 15%;
            height: 8%;
            z-index: 5;
        }

        .btn_status {
            position: absolute;
            right: 11%;
            top: 50%;
            width: 14%;
            height: 8%;
            z-index: 5;
        }

        .btn_street {
            position: absolute;
            right: 11%;
            top: 60%;
            width: 14%;
            height: 8%;
            z-index: 5;
        }

        .btn_talk {
            position: absolute;
            right: 11%;
            top: 70%;
            width: 14%;
            height: 8%;
            z-index: 5;
        }

        .btn_bag {
            position: absolute;
            right: 11%;
            top: 80%;
            width: 14%;
            height: 8%;
            z-index: 5;
        }

        .btn_skipmonth {
            position: absolute;
            right: 15%;
            top: 8%;
            width: 7%;
            height: 6%;
            z-index: 5;
        }

        /* 状态页 */
        #view_status {
            z-index: 10;
        }

        .status_canvas {
            aspect-ratio: 16/9;
            width: min(100vw, calc(100vh * 16 / 9), 1600px);
            height: 100%;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        #status_bg_layer {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .btn_back_status {
            position: absolute;
            left: 3%;
            top: 4%;
            width: 10%;
            height: 7%;
            z-index: 99;
        }

        .attr_wrap {
            position: absolute;
            left: 18%;
            top: 15%;
            width: 64%;
            background: #88231d;
            border-radius: 16px;
            box-shadow: 0 6px 16px rgba(0, 0, 0.6);
            padding: 3% 5%;
            color: #fff;
            font-size: 2cqw;
            line-height: 1.9;
            text-align: center;
            z-index: 10;
        }

        .status_btn_group {
            position: absolute;
            left: 18%;
            bottom: 12%;
            width: 64%;
            display: flex;
            gap: 2.5cqw;
            z-index: 10;
        }

        .status_btn {
            flex: 1;
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0.55);
            padding: 1.8cqw 0;
            color: #fff;
            font-size: 2cqw;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .status_btn:hover {
            transform: scale(1.04);
        }

        .status_btn:active {
            transform: scale(0.96);
        }

        /* 本季安排弹窗 */
        #view_season_plan {
            z-index: 998;
        }

        .plan_mask_bg {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .plan_wrap {
            aspect-ratio: 16/9;
            width: min(100vw, calc(100vh * 16 / 9), 1600px);
            height: auto;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }

        .btn_back {
            position: absolute;
            left: 3%;
            top: 4%;
            width: 10%;
            height: 7%;
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0.55);
            color: #fff;
            font-size: 1.6cqw;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            z-index: 99;
        }

        .btn_back:hover {
            transform: scale(1.04);
        }

        .btn_back:active {
            transform: scale(0.96);
        }

        .plan_main_box {
            position: absolute;
            left: 50%;
            top: 8%;
            transform: translateX(-50%);
            width: 52%;
            height: 76%;
            background: #fcfbf9;
            border: 3px solid #91241e;
            border-radius: 18px;
            padding: 3%;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        .plan_title {
            text-align: center;
            font-size: 2.8cqw;
            color: #91241e;
            font-weight: bold;
            letter-spacing: 8px;
            margin-bottom: 2%;
        }

        .ap_display {
            text-align: center;
            font-size: 1.8cqw;
            color: #91241e;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .lock_tip {
            color: #b82222;
            text-align: center;
            font-size: 1.9cqw;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .slot_wrap {
            flex: 0 0 42%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .slot_item {
            border: 2px dashed #662020;
            border-radius: 8px;
            background: #fff8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2cqw;
            color: #333;
            min-height: 7cqw;
            cursor: pointer;
            transition: 0.2s;
        }

        .slot_item:hover {
            background: #ffe6e6;
        }

        .slot_item.full {
            border: solid #c03030;
            background: #ffeaea;
            font-weight: bold;
        }

        .slot_item.readonly {
            pointer-events: none;
            opacity: 0.7;
        }

        .action_title {
            font-size: 2.2cqw;
            color: #222;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .action_btn_wrap {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
            padding-bottom: 12%;
        }

        .action_drag {
            border: 2px solid #88231d;
            border-radius: 6px;
            padding: 8px 0;
            text-align: center;
            font-size: 1.5cqw;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .action_drag.selected {
            background: #88231d;
            color: #fff;
        }

        .action_drag:hover {
            background: #e2c0bf;
        }

        .action_drag.selected:hover {
            background: #701c18;
        }

        .action_drag.locked {
            display: none !important;
        }

        .action_drag.readonly {
            pointer-events: none;
            opacity: 0.6;
        }

        .btn_confirm {
            flex: 0 0 auto;
            align-self: center;
            width: 30%;
            height: 4cqw;
            margin-top: 0.8cqw;
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0.55);
            color: #fff;
            font-size: 1.6cqw;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 11;
        }

        .btn_confirm:hover {
            background: #9c2821;
        }

        .btn_confirm:active {
            background: #701c18;
        }

        .btn_confirm.readonly {
            pointer-events: none;
            opacity: 0.5;
        }

        /* 简单确认弹窗【已优化适配武试长文本】 */
        #confirm_pop {
            z-index: 1000;
            display: none;
        }

        .confirm_mask {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            position: absolute;
            z-index: 1;
        }

        .confirm_panel {
            /* 加宽、垂直居中、自适应高度、最大高度限制+滚动 */
            position: absolute;
            width: 52%;
            max-height: 80vh;
            left: 24%;
            top: 50%;
            transform: translateY(-50%);
            background: #1a1010;
            border: 3px solid #88231d;
            border-radius: 16px;
            z-index: 2;
            padding: 2cqw 2.5cqw;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            gap: 2cqw;
            overflow-y: auto;
        }

        .confirm_text {
            font-size: 2cqw;
            color: #fff;
            text-align: center;
            line-height: 2;
            width: 100%;
            white-space: pre-line;
        }

        .confirm_btn_group {
            display: flex;
            gap: 12%;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .confirm_btn {
            width: 24%;
            min-width: 10cqw;
            height: 5cqw;
        }

        /* 武试大典弹窗扩展按钮（双选项） */
        .confirm_btn_group.double {
            gap: 8%;
        }

        /* ===== 背包弹窗 ===== */
        #view_bag_pop {
            z-index: 997;
        }

        .bag_mask {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            position: absolute;
            z-index: 1;
        }

        .bag_pop_panel {
            position: absolute;
            width: 70%;
            height: 80%;
            left: 15%;
            top: 10%;
            background: linear-gradient(180deg, #88231d 0%, #6f1c18 100%);
            border: 3px solid #4a100d;
            border-radius: 18px;
            z-index: 2;
            padding: 3% 4%;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 40px rgba(0, 0, 0, 0.25);
        }

        .bag_pop_title {
            text-align: center;
            font-size: 3cqw;
            color: #fff;
            letter-spacing: 10px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
            margin-bottom: 3%;
        }

        .bag_grid {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 3% 2%;
        }

        .bag_item_btn {
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.55);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1cqw;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
            position: relative;
        }

        .bag_item_btn:hover {
            transform: scale(1.04);
            background: #9c2821;
        }

        .bag_item_btn:active {
            transform: scale(0.96);
        }

        .bag_item_btn.empty {
            background: rgba(255, 255, 255, 0.06);
            border: 2px dashed rgba(255, 255, 255, 0.35);
            box-shadow: none;
            cursor: default;
            pointer-events: none;
        }

        .bag_item_icon {
            font-size: 2.8cqw;
            line-height: 1;
        }

        .bag_item_name {
            font-size: 1.6cqw;
            letter-spacing: 3px;
        }

        .bag_item_count {
            position: absolute;
            right: 0.7cqw;
            bottom: 0.5cqw;
            background: rgba(0, 0, 0, 0.45);
            border-radius: 0.7cqw;
            color: #fff;
            font-size: 1.2cqw;
            padding: 0.2cqw 0.7cqw;
        }

        .bag_empty_text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 1.4cqw;
            letter-spacing: 2px;
        }

        .bag_tip {
            margin-top: 3%;
            height: 10%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 1.5cqw;
            letter-spacing: 2px;
            text-align: center;
            padding: 0 1.2cqw;
        }

        .bag_pop_bottom {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 3%;
        }

        .bag_pop_bottom .game_btn {
            width: 12%;
            height: 100%;
        }

        /* 背包物品详情弹窗（在下方弹出，参考弹窗样式：浅色标题栏+深红主体+白色按钮区） */
        #bag_item_pop {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: none;
        }

        .bag_item_mask {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        .bag_item_panel {
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 70%;
            height: 34%;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            overflow: hidden;
            box-shadow: 0 -8px 34px rgba(0, 0, 0, 0.65);
            z-index: 2;
            display: flex;
            flex-direction: column;
        }

        /* 顶部：浅色标题栏 */
        .bag_item_head {
            flex: 0 0 13%;
            background: linear-gradient(180deg, #f7f1e4 0%, #ecdcc2 100%);
            border-bottom: 3px solid #4a100d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bag_item_head_text {
            color: #7c201b;
            font-size: 2cqw;
            letter-spacing: 6px;
            font-weight: bold;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        /* 中部：深红主体（物品文字样式不变） */
        .bag_item_body {
            flex: 1;
            background: linear-gradient(180deg, #8a2424 0%, #802020 55%, #6e1c1c 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 1% 4%;
            text-align: center;
        }

        .bag_item_name {
            color: #fff;
            font-size: 2.3cqw;
            letter-spacing: 4px;
            font-weight: bold;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        .bag_item_desc {
            color: #f3e3df;
            font-size: 1.6cqw;
            line-height: 1.9;
            width: 100%;
        }

        .bag_item_count {
            color: #ffd9a0;
            font-size: 1.5cqw;
            letter-spacing: 2px;
        }

        /* 底部：白色按钮区 */
        .bag_item_foot {
            flex: 0 0 22%;
            background: linear-gradient(180deg, #faf6ee 0%, #f0e6d4 100%);
            border-top: 3px solid #4a100d;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .bag_item_foot .game_btn {
            width: 24%;
            min-width: 8.5cqw;
            height: 4cqw;
            font-size: 1.5cqw;
        }

        /* ===== 日记弹窗（深红书本摊开样式，与确认弹窗配色一致） ===== */
        #view_diary_pop {
            z-index: 996;
        }

        .diary_mask {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            position: absolute;
            z-index: 1;
        }

        /* 弹窗（宽度加长，高度不变） */
        .diary_book {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 86%;
            z-index: 2;
        }

        /* 翻页按钮（书本内左下角 / 右下角，深红与确认弹窗一致） */
        .diary_page_btn {
            position: absolute;
            bottom: 1.5%;
            width: 12%;
            height: 9%;
            background: #88231d;
            border: 2px solid #a03830;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 1.7cqw;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            letter-spacing: 2px;
            z-index: 7;
        }

        #diaryPrevBtn {
            left: 2%;
        }

        #diaryNextBtn {
            right: 2%;
        }

        .diary_page_btn:hover {
            background: #9c2821;
            transform: scale(1.05);
        }

        .diary_page_btn:active {
            transform: scale(0.96);
        }

        .diary_page_btn.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        /* 书本主体（红色书封，去掉黑色） */
        .diary_book_body {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #8a2424 0%, #802020 55%, #6e1c1c 100%);
            border: 3px solid #88231d;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        /* 左右纸页容器（占据整个弹窗） */
        .diary_book_pages {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
        }

        /* 深红书页（上下留出悬浮标题/页码的空间） */
        .diary_page {
            flex: 1;
            background: linear-gradient(180deg, #8a2424 0%, #802020 55%, #6e1c1c 100%);
            color: #fff;
            padding: 8% 4% 7% 4%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 左右页：中间以细腻装订缝分隔 */
        .diary_left_page {
            border-radius: 8px 2px 2px 8px;
            border-right: 2px solid rgba(60, 10, 8, 0.85);
            box-shadow: inset -26px 0 30px -22px rgba(0, 0, 0, 0.6);
        }

        .diary_right_page {
            border-radius: 2px 8px 8px 2px;
            border-left: 2px solid rgba(60, 10, 8, 0.85);
            box-shadow: inset 26px 0 30px -22px rgba(0, 0, 0, 0.6);
        }

        /* 单条日记 */
        .diary_entry {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 1.5cqw;
            line-height: 1.8;
            white-space: pre-line;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .diary_entry_time {
            color: #ffd9a0;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 4px;
            font-size: 1.6cqw;
        }

        .diary_page_empty {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.6cqw;
            letter-spacing: 3px;
            text-align: center;
            margin-top: 35%;
        }

        /* 页码（悬浮于弹窗底部，不占内容空间） */
        .diary_page_num {
            position: absolute;
            bottom: 1%;
            left: 0;
            right: 0;
            text-align: center;
            color: #fff;
            font-size: 1.2cqw;
            letter-spacing: 3px;
            z-index: 5;
        }

        /* 关闭按钮（悬浮于弹窗右上角，可点击） */
        .diary_close_btn {
            position: absolute;
            right: 1%;
            top: 1%;
            width: 8%;
            height: 8%;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 8px;
            color: #fff;
            font-size: 1.2cqw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            z-index: 6;
            pointer-events: auto;
        }

        .diary_close_btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .diary_close_btn:active {
            transform: scale(0.96);
        }

        /* ===== 交谈弹窗（参照交谈.jpg：深灰背景+左侧人物+右侧对话） ===== */
        #view_talk_pop {
            z-index: 995;
        }

        .talk_mask {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            position: absolute;
            z-index: 1;
        }

        .talk_panel {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 74%;
            height: 78%;
            background: linear-gradient(180deg, #8a2424 0%, #6e1c1c 100%);
            border: 3px solid #4a100d;
            border-radius: 18px;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(0, 0, 0, 0.5);
            z-index: 2;
            display: flex;
            overflow: hidden;
        }

        /* 左侧人物区 */
        .talk_left {
            width: 38%;
            flex: 0 0 38%;
            background: linear-gradient(180deg, #7a1f1a 0%, #6e1c1c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #4a100d;
            overflow: hidden;
        }

        .talk_left img {
            width: auto;
            height: 120%;
            max-width: 120%;
            object-fit: contain;
            object-position: center center;
        }

        /* 右侧对话区（深红背景） */
        .talk_right {
            flex: 1;
            background: linear-gradient(180deg, #802020 0%, #6e1c1c 100%);
            display: flex;
            flex-direction: column;
            padding: 3% 4%;
            min-width: 0;
        }

        /* 交谈标题 */
        .talk_title {
            flex: 0 0 auto;
            text-align: center;
            font-size: 2.4cqw;
            color: #ffd9a0;
            letter-spacing: 10px;
            font-weight: bold;
            margin-bottom: 3%;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
        }

        /* 消息列表（双方对话气泡） */
        .talk_messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding: 4% 5%;
            min-height: 0;
        }

        .talk_msg {
            max-width: 78%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 1.5cqw;
            line-height: 1.8;
            white-space: pre-line;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        /* 对方消息（左侧，浅色气泡） */
        .talk_msg.other {
            align-self: flex-start;
            background: linear-gradient(180deg, #ece3d3 0%, #ddd1bd 100%);
            color: #4a3520;
            border: 1px solid #c9b99e;
            border-top-left-radius: 4px;
        }

        /* 我方消息（右侧，红色气泡） */
        .talk_msg.me {
            align-self: flex-end;
            background: linear-gradient(180deg, #9c2821 0%, #88231d 100%);
            color: #fff;
            border: 1px solid #6f1c18;
            border-top-right-radius: 4px;
        }

        /* 底部输入栏（输入框 + 按钮） */
        .talk_input_bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 2%;
            padding: 2.5% 3%;
            border-top: 2px solid rgba(255, 255, 255, 0.14);
        }

        .talk_input {
            flex: 1;
            height: 4.2cqw;
            background: #5a1414;
            border: 1px solid #ffd9a0;
            border-radius: 10px;
            color: #fff;
            font-size: 1.5cqw;
            padding: 0 4%;
            outline: none;
            min-width: 0;
        }

        .talk_input::placeholder {
            color: #8a8a8a;
        }

        .talk_input:focus {
            border-color: #ffd9a0;
        }

        .talk_btn {
            height: 4.2cqw;
            background: #88231d;
            border-radius: 12px;
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 1.5cqw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            white-space: nowrap;
            padding: 0 4%;
        }

        .talk_btn:hover {
            background: #9c2821;
            transform: scale(1.04);
        }

        .talk_btn:active {
            transform: scale(0.96);
        }

        .talk_send_btn {
            flex: 0 0 auto;
            background: #a03028;
        }

        /* 关闭按钮 */
        .talk_close {
            position: absolute;
            right: 1.2%;
            top: 1.2%;
            width: 8%;
            height: 7%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            color: #fff;
            font-size: 1.3cqw;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: 0.2s;
            z-index: 5;
        }

        .talk_close:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* 手机横屏引导页（竖屏时显示；点击按钮进入全屏锁定横屏） */
        #rotateTip {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 99999;
            background: rgba(20, 10, 10, 0.55);
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        #rotateTip.show {
            display: flex;
        }

        #rotateTip .tip_panel {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 84%;
            max-width: 380px;
            padding: 28px 22px;
            border-radius: 16px;
            background: #8a2424;
            border: 2px solid #c0392b;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
        }

        #rotateTip .tip_icon {
            font-size: 46px;
            animation: tilt 1.6s ease-in-out infinite;
        }

        #rotateTip .tip_text {
            font-size: 16px;
            line-height: 1.8;
            margin: 16px 0 22px;
            letter-spacing: 1px;
        }

        #rotateTip .tip_btn {
            display: inline-block;
            background: #fff;
            color: #88231d;
            border: none;
            border-radius: 999px;
            font-size: 17px;
            font-weight: bold;
            padding: 12px 32px;
            letter-spacing: 2px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        #rotateTip .tip_btn:active {
            transform: scale(0.95);
        }

        #rotateTip .tip_hint {
            margin-top: 14px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.72);
        }

        /* iOS 兜底：已点击进入但无法锁屏时，旋转画面并显示顶部小提示 */
        #rotateTip.minimized {
            background: transparent;
            justify-content: flex-start;
            align-items: flex-start;
            padding-top: max(12px, env(safe-area-inset-top));
            pointer-events: none;
        }

        #rotateTip.minimized .tip_panel {
            margin: 0 auto;
            padding: 9px 18px;
            border-radius: 999px;
            background: rgba(26, 16, 16, 0.9);
            font-size: 13px;
            border-color: #a03830;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        }

        #rotateTip.minimized .tip_btn,
        #rotateTip.minimized .tip_hint {
            display: none;
        }

        @keyframes tilt {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(90deg);
            }
        }

        /* ===== 移动端触屏：禁用 hover 粘滞（点击后放大/变色残留） ===== */
        @media (hover: none) {

            img[class^="btn_"]:hover,
            .cover_btn img:hover,
            .game_btn:hover,
            .btn_back:hover,
            .btn_confirm:hover,
            .save_slot:hover,
            .save_slot_auto:hover,
            .status_btn:hover,
            .diary_page_btn:hover,
            .bag_item_btn:hover,
            .talk_btn:hover,
            .action_drag:hover,
            .action_btn:hover,
            .scene_btn:hover,
            .back_btn:hover,
            .ar_ok:hover,
            .ac_option:hover {
                transform: none;
            }

            .action_drag:hover,
            .ac_option:hover {
                background: #fff;
            }

            .action_drag.selected:hover {
                background: #88231d;
            }

            .scene_btn:hover,
            .action_btn:hover,
            .game_btn:hover,
            .btn_back:hover,
            .back_btn:hover,
            .status_btn:hover,
            .diary_page_btn:hover,
            .talk_btn:hover,
            .ar_ok:hover {
                background: #88231d;
            }

            .talk_send_btn:hover {
                background: #a03028;
            }

            .btn_confirm:hover,
            .bag_item_btn:hover {
                background: #9c2821;
            }

            .save_slot:hover,
            .save_slot_auto:hover {
                background: #441c1c;
            }
        }

        /* ===== 手机竖屏自动横屏（画面旋转 90° 铺满竖屏；由 .portrait-rotate 类控制，JS 仅在竖屏时添加） ===== */
        html.portrait-rotate #root_canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vh;
            height: 100vw;
            max-width: none;
            transform: translate(-50%, -50%) rotate(90deg);
        }

        html.portrait-rotate .status_canvas,
        html.portrait-rotate .plan_wrap {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>

<body>
    <div id="root_canvas">
        <!-- 封面 -->
        <div class="view" id="view_cover">
            <div id="bg"></div>
            <div class="cover_btn_box">
                <img id="startNewBtn" src="start.png">
                <img id="loadSaveBtn" src="save.png">
            </div>
        </div>
        <!-- 主界面 -->
        <div class="view" id="view_main">
            <div id="bg_layer"></div>
            <img class="img_char" src="renwulihui/立绘2.webp" loading="lazy">
            <div class="left_white_box"><img src="renwulihui/人物2.webp" loading="lazy"></div>
            <img class="img_top_time" src="top_time_ui.png" loading="lazy">
            <div class="text_top_time" id="timeText"></div>
            <img class="img_news_box" src="news_box.png" loading="lazy">
            <div class="text_news_title">小道新闻</div>
            <div class="text_news_content" id="newsContent"></div>
            <div class="game_btn btn_seasonplan" id="btnSeasonPlan">本季安排</div>
            <div class="game_btn btn_diary" id="btnDiary">查看日记</div>
            <div class="game_btn btn_status" id="btnOpenStatus">状态</div>
            <div class="game_btn btn_street" id="btnStreet">上街</div>
            <div class="game_btn btn_talk" id="btnTalk">交谈</div>
            <div class="game_btn btn_bag" id="btnBag">背包</div>
            <div class="game_btn btn_skipmonth" id="btnSkipMonth">跳过</div>
        </div>
        <!-- 状态 -->
        <div class="view" id="view_status">
            <div class="status_canvas">
                <div id="status_bg_layer"></div>
                <div class="game_btn btn_back_status" id="btnCloseStatus">返回</div>
                <div class="attr_wrap" id="attrPanel"></div>
                <div class="status_btn_group">
                    <div class="status_btn" id="openSavePanelBtn">存档</div>
                    <div class="status_btn" id="openLoadPanelBtn">读档</div>
                    <div class="status_btn" id="resetBtn">重新开始</div>
                </div>
            </div>
        </div>
        <!-- 存档弹窗 -->
        <div class="view" id="view_save_pop">
            <div class="save_mask"></div>
            <div class="save_panel">
                <div class="save_title" id="savePopTitle">存档</div>
                <div class="save_slot_auto" id="slotAuto"></div>
                <div class="save_slot_manual_wrap" id="manualSlotWrap"></div>
                <div class="save_bottom_btn">
                    <div class="game_btn" id="closeSavePopBtn">关闭</div>
                </div>
            </div>
        </div>
        <!-- 本季安排 -->
        <div class="view" id="view_season_plan">
            <div class="plan_mask_bg"></div>
            <div class="plan_wrap">
                <div class="btn_back" id="closeSeasonPlan">返回</div>
                <div class="plan_main_box">
                    <div class="plan_title">本季安排</div>
                    <div class="lock_tip" id="lockTip" style="display:none;">当前季度安排已锁定，三个月后可重新修改</div>
                    <div class="ap_display" id="apDisplay">可用行动点：4/4</div>
                    <div class="slot_wrap">
                        <div class="slot_item" data-slot="0">拖入行动</div>
                        <div class="slot_item" data-slot="1">拖入行动</div>
                        <div class="slot_item" data-slot="2">拖入行动</div>
                        <div class="slot_item" data-slot="3">拖入行动</div>
                    </div>
                    <div class="action_title">点击下方行动选择（最多4项，点击卡槽可移除）</div>
                    <div class="action_btn_wrap">
                        <div class="action_drag" data-min="8" data-name="跑腿">跑腿</div>
                        <div class="action_drag" data-min="8" data-name="休息">休息</div>
                        <div class="action_drag" data-min="8" data-name="礼仪">礼仪</div>
                        <div class="action_drag" data-min="10" data-name="书院">书院</div>
                        <div class="action_drag" data-min="11" data-name="习剑">习剑</div>
                        <div class="action_drag" data-min="11" data-name="体术">体术</div>
                        <div class="action_drag" data-min="12" data-name="术法">术法</div>
                        <div class="action_drag" data-special="temple" data-name="道观">道观</div>
                        <div class="action_drag" data-min="14" data-name="出宫">出宫</div>
                        <div class="action_drag" data-min="16" data-name="外交">外交</div>
                    </div>
                    <div class="btn_confirm" id="confirmPlan">确认本季安排</div>
                </div>
            </div>
        </div>
        <!-- 确认弹窗（复用武试大典、季度结束提示） -->
        <div class="view" id="confirm_pop">
            <div class="confirm_mask"></div>
            <div class="confirm_panel">
                <div class="confirm_text" id="confirmText"></div>
                <div class="confirm_btn_group" id="confirmBtnGroupWrap">
                    <div class="game_btn confirm_btn" id="confirmCancel">取消</div>
                    <div class="game_btn confirm_btn" id="confirmOk">确定</div>
                </div>
            </div>
        </div>
        <!-- 背包弹窗 -->
        <div class="view" id="view_bag_pop">
            <div class="bag_mask"></div>
            <div class="bag_pop_panel">
                <div class="bag_pop_title">背 包</div>
                <div class="bag_grid" id="bagGrid"></div>
                <div class="bag_tip" id="bagTip">点击物品查看详情</div>
                <div class="bag_pop_bottom">
                    <div class="game_btn" id="closeBagPop">关闭</div>
                </div>
            </div>
            <!-- 物品详情弹窗 -->
            <div id="bag_item_pop">
                <div class="bag_item_mask" id="bagItemMask"></div>
                <div class="bag_item_panel">
                    <div class="bag_item_head">
                        <div class="bag_item_head_text">物品详情</div>
                    </div>
                    <div class="bag_item_body">
                        <div class="bag_item_name" id="bagItemName">福寿膏</div>
                        <div class="bag_item_desc" id="bagItemDesc"></div>
                        <div class="bag_item_count" id="bagItemCount"></div>
                    </div>
                    <div class="bag_item_foot">
                        <div class="game_btn" id="bagUse">使用</div>
                        <div class="game_btn" id="bagItemClose">关闭</div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 日记弹窗（书本摊开样式） -->
        <div class="view" id="view_diary_pop">
            <div class="diary_mask"></div>
            <div class="diary_book">
                <div class="diary_book_body">
                    <div class="diary_close_btn" id="diaryCloseBtn">关闭</div>

        // ===================== 新增武试大典NPC战力配置 =====================

        // 每年9月检测武试大典（不变，九月必弹）
        function checkWuShiDaDian() {
            const y = GameState.year;
            const m = GameState.month;
            // 仅9月触发
            if (m !== 9) return;
            // 读取当年是否已触发大典标记
            const wushiYearMark = safeGet("wushiYearMark") || "";
            if (wushiYearMark === String(y)) return;
            refreshAgeBySkipCount();
            // 标记今年已触发，防止重复弹窗
            safeSet("wushiYearMark", String(y));
            // 到达参赛年龄（15岁）后每年9月都可真正参加；未满15岁为旁观提示
            if (currentAge < 15) {
                // 记录到本季度日记
                addDiaryEvent("武试大典如期举行，年幼旁观。");
                showConfirm("武试大典\n一年一度的武试大典如期举行。你尚年幼，无缘登台，只能远远观望这天下群英的较量。");

                confirmCancel.style.display = "none";
                return;
            }
            // 计算玩家总战力：武力+法力+体魄
            const playerPower = GameState.force + GameState.magic + GameState.physique;
            // 生成随机排名：铁木儿固定第一，其余随机打乱
            let randomOthers = WuShiNPC.filter(n => !n.fixedFirst);
            // 随机打乱数组
            for (let i = randomOthers.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [randomOthers[i], randomOthers[j]] = [randomOthers[j], randomOthers[i]];
            }
            let rankList = [WuShiNPC.find(n => n.fixedFirst), ...randomOthers];
            let playerRank = 0;
            for (let i = 0; i < rankList.length; i++) {
                if (playerPower > rankList[i].power) {
                    playerRank = i + 1;
                    break;
                }
            }
            // 判断是否击败铁木儿
            const beatTiemuer = playerPower > 999;
            // 储存击败标记
            if (beatTiemuer) {
                safeSet("beatTiemuerFlag", "true");
                safeSet("beatTiemuerAge", String(currentAge));
            }
            // 记录武试大典到本季度日记（固定事件）
            addDiaryEvent(playerRank > 0 ? `武试大典：本届排名第${playerRank}名` : "武试大典举行，未能上榜。");
            if (beatTiemuer) addDiaryEvent("于武试大典击败天下第一的铁木儿！");
            // 组装排名文本
            let rankText = "本届武试大典名次：\n";
            rankList.forEach((npc, idx) => {
                rankText += `${idx + 1}.${npc.name}（战力${npc.power}）\n`;
            })
            if (playerRank > 0) {
                // 玩家上榜：显示排名
                rankText += `你的总战力：${playerPower}，本次排名：第${playerRank}名`;
            } else {
                // 玩家未上榜：只显示NPC排名
                rankText += `你的总战力：${playerPower}，未能上榜，静待来年再战。`;
            }
            // 分支弹窗
            const btnWrap = document.getElementById("confirmBtnGroupWrap");
            btnWrap.className = "confirm_btn_group";
            document.getElementById("confirmCancel").style.display = "flex";
            document.getElementById("confirmOk").style.display = "flex";
            if (!beatTiemuer) {
                // 未打赢铁木儿，普通单确定弹窗
                showConfirm(rankText + "\n\n大典结束，静待明年再战。");
                confirmOk.onclick = function () {
                    closeConfirmPop();
                    maybeTriggerDongChuang();
                };
                confirmCancel.style.display = "none";
            } else {
                if (currentAge < 20 && safeGet("beatTiemuerDialogShown") !== "true") {
                    // 20岁前击败铁木儿且未弹过：先后弹出两个窗口（只弹一次）
                    safeSet("beatTiemuerDialogShown", "true");
                    // 第一个窗口：恭喜
                    showConfirm(rankText + "\n\n恭喜！你终于战胜了铁木儿，祝武道昌隆！");
                    confirmOk.innerText = "确定";
                    confirmOk.style.display = "flex";
                    confirmCancel.style.display = "none";
                    btnWrap.className = "confirm_btn_group";
                    confirmOk.onclick = function () {
                        closeConfirmPop();
                        // 第二个窗口：你的力量真的属于你自己吗？
                        showConfirm("你拥有的力量真的属于你自己吗？");
                        confirmOk.innerText = "确定";
                        confirmCancel.style.display = "none";
                        confirmOk.onclick = function () {
                            closeConfirmPop();
                            confirmOk.innerText = "确定";
                            btnWrap.className = "confirm_btn_group";
                            maybeTriggerDongChuang();
                        };
                    };
                } else {
                    // 其他情况击败铁木儿：普通单确定弹窗
                    showConfirm(rankText + "\n\n你击败了天下第一的铁木儿！");
                    confirmOk.onclick = function () {
                        closeConfirmPop();
                        maybeTriggerDongChuang();
                    };
                    confirmCancel.style.display = "none";
                }
            }
        }
        // 14岁当年12月提示可参加武试大典
        function checkWuShiReadyTip() {
            if (currentAge === 14 && GameState.month === 12) {
                // 只提示一次
                const tipShown = safeGet("wushiReadyTipShown") === "true";
                if (!tipShown) {
                    showConfirm("岁末佳音\n你已年满十四，武艺初成。来年九月，武试大典即将举行，届时你可参加一试身手！");
                    confirmOk.onclick = closeConfirmPop;
                    confirmCancel.style.display = "none";
                    safeSet("wushiReadyTipShown", "true");
                }
            }
        }
        // 19岁9月武试结算后触发东窗事发结局（18岁前击败铁木儿）
        function checkDongChuangShiFa() {
            refreshAgeBySkipCount();
            // 仅19岁时触发
            if (currentAge !== 19) return;
            // 19岁9月武试大典结算后触发
            if (GameState.month !== 9) return;
            // 已触发过则不再重复
            if (safeGet("dongChuangEndFlag") === "true") return;
            const beatFlag = safeGet("beatTiemuerFlag") === "true";
            const beatAge = Number(safeGet("beatTiemuerAge") || 99);
            // 需在18岁之前击败铁木儿
            if (!beatFlag || beatAge >= 18) return;
            // 标记待触发（等待武试大典弹窗关闭后弹出）
            safeSet("pendingDongChuang", "true");
        }
        // 武试大典弹窗关闭后触发东窗事发
        function maybeTriggerDongChuang() {
            if (safeGet("pendingDongChuang") === "true") {
                safeDel("pendingDongChuang");
                showConfirm("东窗事发\n你早年修习的功法并非正道，如今底细败露，世间人人对你唾弃，你无法再留于城内，孤身远走江湖，从此销声匿迹。\n");
                confirmOk.onclick = closeConfirmPop;
                confirmCancel.style.display = "none";
                safeSet("dongChuangEndFlag", "true");
                // 记录到本季度日记
                addDiaryEvent("东窗事发：早年功法底细败露，被迫远走江湖，销声匿迹。");
            }
        }
        // 每月5-20随机区间
        const ActionRandomAttr = {
            "跑腿": { beauty: [5, 10], physique: [10, 20], culture: [5, 8], force: [8, 18], intellect: [5, 10], magic: [5, 8], emotion: [10, 20], hate: [0, 0] },
            "休息": { beauty: [10, 20], physique: [12, 20], culture: [5, 10], force: [5, 8], intellect: [8, 15], magic: [5, 10], emotion: [12, 20], hate: [-20, -5] },
            "礼仪": { beauty: [12, 20], physique: [5, 10], culture: [10, 20], force: [5, 8], intellect: [10, 20], magic: [5, 10], emotion: [10, 18], hate: [0, 0] },
            "书院": { beauty: [5, 12], physique: [5, 10], culture: [15, 20], force: [5, 10], intellect: [12, 20], magic: [8, 18], emotion: [8, 15], hate: [5, 15] },
            "习剑": { beauty: [5, 10], physique: [12, 20], culture: [5, 8], force: [15, 20], intellect: [5, 12], magic: [5, 10], emotion: [5, 12], hate: [5, 20] },
            "体术": { beauty: [5, 8], physique: [15, 20], culture: [5, 8], force: [12, 20], intellect: [5, 10], magic: [5, 8], emotion: [5, 10], hate: [5, 18] },
            "术法": { beauty: [8, 18], physique: [5, 10], culture: [10, 18], force: [5, 10], intellect: [12, 20], magic: [15, 20], emotion: [5, 12], hate: [0, 0] },
            "出宫": { beauty: [10, 20], physique: [8, 15], culture: [5, 12], force: [5, 12], intellect: [10, 18], magic: [5, 8], emotion: [12, 20], hate: [8, 20] },

            "道观": { beauty: [8, 18], physique: [10, 20], culture: [10, 18], force: [5, 12], intellect: [10, 20], magic: [12, 20], emotion: [15, 20], hate: [-20, -10] }

        const SeasonBgMap = { spring: "chunbeijing.webp", summer: "xiabeijing.webp", autumn: "qiubeijing.webp", winter: "dongbeijing.webp" };
        // 8-15岁固定弹窗内容
        const AgeDialogs = {
            8: "八岁·初入宫门\n你尚是稚童，懵懂间踏入这座深宫。宫墙高耸，人声鼎沸，一切都充满新奇与未知。",

            11: "十一岁·情窦初开\n你开始注意到身边的人，心底泛起微澜，却不知这份悸动将通向何方。",

        // 检查并触发8-15岁固定弹窗（每个年龄只弹一次）
        function checkAgeDialog() {
            if (currentAge >= 8 && currentAge <= 15) {
                let shown = safeGet("shownAgeDialogs") || "";

                    const content = AgeDialogs[currentAge];

                        showConfirm(content);
                        confirmOk.onclick = closeConfirmPop;
                        confirmCancel.style.display = "none";

        // DOM元素
        const bgLayer = document.getElementById("bg_layer");
        const timeText = document.getElementById("timeText");
        const newsContent = document.getElementById("newsContent");
        const attrPanel = document.getElementById("attrPanel");
        const statusBg = document.getElementById("status_bg_layer");
        const savePopTitle = document.getElementById("savePopTitle");
        const slotAuto = document.getElementById("slotAuto");
        const manualSlotWrap = document.getElementById("manualSlotWrap");
        const closeSavePopBtn = document.getElementById("closeSavePopBtn");
        const confirmPop = document.getElementById("confirm_pop");
        const confirmText = document.getElementById("confirmText");
        const confirmCancel = document.getElementById("confirmCancel");
        const confirmOk = document.getElementById("confirmOk");
        const lockTip = document.getElementById("lockTip");
        // 随机数
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }
        // 弹窗工具（极简同步，无阻塞回调）
        function showConfirm(text) {
            confirmText.innerText = text;
            confirmPop.style.display = "block";
        }
        function closeConfirmPop() {
            confirmPop.style.display = "none";
        }
        function hideAllView() {
            document.querySelectorAll(".view").forEach(v => v.style.display = "none");
        }
        function showView(id) {
            hideAllView();
            document.getElementById(id).style.display = "block";
        }
        function closeSeasonPlanPop() {
            document.getElementById("view_season_plan").style.display = "none";
        }
        // ===================== 背包弹窗 =====================
        // 背包物品数据（支持动态添加，存入 localStorage）
        const DEFAULT_BAG_ITEMS = [
            { id: "fushougao", name: "福寿膏", count: 1, desc: "一种珍贵的滋补良药，据说能温养气血、安神定魄。" },
            { id: "yanzhiyupei", name: "胭脂玉佩", count: 1, desc: "温润如脂的玉佩，散发淡淡胭脂香，是贵人赠予的信物。" }
        ];
        function loadBagItems() {
            let raw = safeGet("bagItems");
            if (!raw) return JSON.parse(JSON.stringify(DEFAULT_BAG_ITEMS));
            try {
                let arr = JSON.parse(raw);
                if (Array.isArray(arr)) return arr;
            } catch (e) { }
            return JSON.parse(JSON.stringify(DEFAULT_BAG_ITEMS));
        }
        function saveBagItems(arr) {
            safeSet("bagItems", JSON.stringify(arr));
        }
        function addBagItem(id, name, desc) {
            let arr = loadBagItems();
            let found = arr.find(it => it.id === id);
            if (found) {
                found.count = (found.count || 1) + 1;
            } else {
                arr.push({ id: id, name: name, count: 1, desc: desc });
            }
            saveBagItems(arr);
            return arr;
        }
        function showBagPop() {
            renderBag();
            document.getElementById("view_bag_pop").style.display = "block";
        }
        function hideBagPop() {
            document.getElementById("view_bag_pop").style.display = "none";
        }
        // 渲染背包物品格
        function renderBag() {
            const grid = document.getElementById("bagGrid");
            grid.innerHTML = "";
            const items = loadBagItems();
            for (let i = 0; i < 10; i++) {
                const item = items[i];
                const cell = document.createElement("div");
                if (item) {
                    cell.className = "bag_item_btn";
                    cell.innerHTML = `
                <div class="bag_item_name">${item.name}</div>
                <div class="bag_item_count">×${item.count}</div>
            `;
                    cell.onclick = () => openBagItemPop(item);

                    cell.className = "bag_item_btn empty";
                    cell.innerHTML = `<div class="bag_empty_text">空</div>`;
                }
                grid.appendChild(cell);
            }
        }
        // 打开物品详情弹窗
        function openBagItemPop(item) {
            document.getElementById("bagItemName").innerText = item.name;
            document.getElementById("bagItemDesc").innerText = item.desc;
            document.getElementById("bagItemCount").innerText = `数量：${item.count}`;
            document.getElementById("bag_item_pop").style.display = "block";
            document.getElementById("bagTip").innerText = `已选择：${item.name}`;
        }
        // 关闭物品详情弹窗
        function closeBagItemPop() {
            document.getElementById("bag_item_pop").style.display = "none";
        }
        // 读取本地存储，全部捕获错误
        function safeGet(key) {
            try {
                return localStorage.getItem(key);
            } catch (e) { return null; }
        }
        function safeSet(key, val) {
            try {
                localStorage.setItem(key, val);
            } catch (e) { }
        }
        function safeDel(key) {
            try {
                localStorage.removeItem(key);
            } catch (e) { }
        }
        // 计算年龄
        function refreshAgeBySkipCount() {
            let raw = safeGet("skipMonthCount");
            let skipTotal = raw ? Number(raw) : 0;
            currentAge = 8 + Math.floor(skipTotal / 12);
            if (currentAge < 8) currentAge = 8;
            currentSeason = getSeason(GameState.month);
            unlockTemple = safeGet("unlockTemple") === "true";
        }
        function getSeason(m) {
            if (m >= 1 && m <= 3) return "spring";
            if (m >= 4 && m <= 6) return "summer";
            if (m >= 7 && m <= 9) return "autumn";
            return "winter";
        }
        function openSeasonPlanPop() {
            document.getElementById("view_season_plan").style.display = "block";

        function showSavePop() { document.getElementById("view_save_pop").style.display = "block"; }

        function getAllSaveSlot() {
            let raw = safeGet("allSaveSlot");
            if (!raw) {
                let init = JSON.stringify({ 0: null, 1: null, 2: null, 3: null });
                safeSet("allSaveSlot", init);
                return { 0: null, 1: null, 2: null, 3: null };
            }
            try { return JSON.parse(raw); } catch { return { 0: null, 1: null, 2: null, 3: null }; }
        }
        function saveGame() {
            safeSet("gameSave", JSON.stringify(GameState));
        }
        function writeSlot(idx) {
            let slots = getAllSaveSlot();
            slots[idx] = JSON.parse(JSON.stringify(GameState));
            safeSet("allSaveSlot", JSON.stringify(slots));
        }
        function loadSlot(idx) {
            let slots = getAllSaveSlot();
            if (slots[idx] === null) return false;
            GameState = Object.assign({}, defaultState, slots[idx]);
            saveGame();
            refreshUI();
            refreshStatusAttr();
            return true;
        }
        function openSavePanel(mode) {
            currentSavePopMode = mode;
            savePopTitle.innerText = mode === "save" ? "存档" : "读档";
            renderAllSlots();
            showSavePop();
        }
        function renderAllSlots() {
            const slots = getAllSaveSlot();
            const autoData = slots[0];
            slotAuto.innerHTML = autoData === null
                ? `<div class="save_slot_empty">自动存档位</div><div class="save_slot_empty">空存档</div>`
                : `<div class="save_slot_hasdata">自动存档位</div><div class="save_slot_hasdata">大晏${autoData.year}年${autoData.month}</div>`;
            slotAuto.onclick = () => slotClickHandler(0, slots[0]);
            manualSlotWrap.innerHTML = "";
            [1, 2, 3, 4].forEach(i => {
                let data = slots[i];
                let div = document.createElement("div");
                div.className = "save_slot";
                div.innerHTML = data === null
                    ? `<div class="save_slot_empty">存档${i}</div><div class="save_slot_empty">空存档</div>`
                    : `<div class="save_slot_hasdata">存档${i}</div><div class="save_slot_hasdata">大晏${data.year}</div>`;
                div.onclick = () => slotClickHandler(i, data);
                manualSlotWrap.appendChild(div);
            })
        }
        function slotClickHandler(idx, data) {
            if (currentSavePopMode === "save") {
                if (data !== null) {
                    showConfirm(`存档${idx}已有存档，是否覆盖？`);
                    confirmOk.onclick = function () {

        // 追加一条消息气泡
        function appendTalkMsg(cls, text) {
            const box = document.getElementById("talkMessages");
            const div = document.createElement("div");
            div.className = `talk_msg ${cls}`;
            div.textContent = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }
        // 一来一回的问答：玩家发一句，对方答一句；按玩家发言匹配主题，同一主题逐句回应，聊完再匹配下一句
        let talkTopicPos = -1;   // 当前主题在 TalkTopics 中的位置
        let talkLineIdx = 0;     // 当前主题已答到第几句
        // 取对方的下一个回答：先按玩家发言匹配新主题；未命中则继续当前主题（保持连贯）；都不中则兜底倾听
        function nextTalkReply(userText) {
            const hits = [];
            TalkTopics.forEach((tp, i) => {
                if (tp.keys.some(k => userText.includes(k))) hits.push(i);
            });
            if (hits.length) {
                talkTopicPos = hits[Math.floor(Math.random() * hits.length)];
                talkLineIdx = 0;
                return TalkReplies[TalkTopics[talkTopicPos].idx].split("\n")[talkLineIdx++];
            }
            // 未匹配到新主题：若当前主题还没说完，接着往下说
            if (talkTopicPos >= 0) {
                const lines = TalkReplies[TalkTopics[talkTopicPos].idx].split("\n");
                if (talkLineIdx < lines.length) {
                    return lines[talkLineIdx++];
                }
            }
            // 兜底倾听，不乱答
            talkTopicPos = -1;
            talkLineIdx = 0;
            return TalkFallback[Math.floor(Math.random() * TalkFallback.length)];
        }

            input.value = "";
            appendTalkMsg("me", text);
            const reply = nextTalkReply(text);
            setTimeout(() => { appendTalkMsg("other", reply); }, 500);
        }

        let rotateRequested = false;

        document.addEventListener("fullscreenchange", function () { setTimeout(applyOrientation, 300); });
        // 本版本不使用 Service Worker，避免旧缓存导致黑屏问题
        // —— 兼容性兜底：清理旧 SW/缓存 + 为不支持容器查询单位(cqw)的浏览器注入 vw 近似样式 ——
        (function () {
            // 1) 主动注销残留的旧 Service Worker（同源）并清空缓存
            if ('serviceWorker' in navigator) {
                try {
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                        for (var i = 0; i < regs.length; i++) regs[i].unregister();
                    })['catch'](function () { });
                } catch (e) { }
            }
            if (window.caches && window.caches.keys) {
                try {
                    window.caches.keys().then(function (keys) {
                        for (var j = 0; j < keys.length; j++) window.caches['delete'](keys[j]);
                    })['catch'](function () { });
                } catch (e) { }
            }
            // 2) 不支持 cqw/cqh（iOS Safari<16、旧版安卓/微信内核）时，把样式表里的
            //    cqw/cqh 自动换算成 vw/vh 注入，避免布局失效导致黑屏/错乱
            var supportsCq = false;
            try { supportsCq = window.CSS && CSS.supports && CSS.supports('width', '1cqw'); } catch (e) { }
            if (supportsCq) return;
            try {
                function collectCq(list) {
                    var out = '';
                    for (var i = 0; i < list.length; i++) {
                        var rule = list[i];
                        var sel = rule.selectorText;
                        if (sel) {
                            var st = rule.style;
                            var props = [];
                            for (var p = 0; p < st.length; p++) {
                                var name = st[p] || st.item(p);
                                var val = st.getPropertyValue(name);
                                if (val.indexOf('cqw') < 0 && val.indexOf('cqh') < 0) continue;
                                var imp = st.getPropertyPriority(name) ? ' !important' : '';
                                var rep = val
                                    .replace(/(-?[\d.]+)cqw/g, function (m, n) { return n + 'vw'; })
                                    .replace(/(-?[\d.]+)cqh/g, function (m, n) { return n + 'vh'; });
                                props.push(name + ':' + rep + imp);
                            }
                            if (props.length) out += sel + '{' + props.join(';') + '}';
                            continue;
                        }
                        if (rule.cssRules) {
                            var inner = collectCq(rule.cssRules);
                            if (inner) {
                                var cond = '';
                                if (rule.media && rule.media.mediaText) cond = rule.media.mediaText;
                                else if (rule.conditionText) cond = rule.conditionText;
                                if (cond) out += '@media ' + cond + '{' + inner + '}';
                                else out += inner;
                            }
                        }
                    }
                    return out;
                }
                var cssText = collectCq(document.styleSheets);
                if (cssText) {
                    var fb = document.createElement('style');
                    fb.setAttribute('data-cq-fallback', '1');
                    fb.textContent = cssText;
                    document.head.appendChild(fb);
                }
            } catch (e) { }
        })();
    </script>
